[project]
name = "challenge-consumer-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "aiokafka>=0.12,<1", "asyncpg>=0.30,<1", "pydantic-settings>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
