name: Compose verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach

      - name: Verify end-to-end flow
        run: bash scripts/verify-e2e.sh

      - name: Verify Kafka retention and reprocessing
        run: bash scripts/verify-kafka-reprocess.sh

      - name: Run small load test
        run: LOAD_REQUESTS=20 LOAD_WORKERS=2 bash scripts/verify-load.sh

      - name: Verify PostgreSQL backup and restore
        run: bash scripts/verify-backup-restore.sh

      - name: Verify alert and recovery
        run: bash scripts/verify-alert-recovery.sh

      - name: Scan producer API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: desafio-igeos-kubes-producer-api:latest
          format: json
          output: trivy-producer-api.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Scan consumer API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: desafio-igeos-kubes-consumer-api:latest
          format: json
          output: trivy-consumer-api.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Scan producer web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: desafio-igeos-kubes-producer-web:latest
          format: json
          output: trivy-producer-web.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Scan consumer web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: desafio-igeos-kubes-consumer-web:latest
          format: json
          output: trivy-consumer-web.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-setup-trivy: true

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show service state
        if: always()
        run: docker compose ps --all

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove CI environment
        if: always()
        run: docker compose down --volumes --remove-orphans
