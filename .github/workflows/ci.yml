name: Compose verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local configuration
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build --detach

      - name: Verify end-to-end flow
        run: bash scripts/verify-e2e.sh

      - name: Show service state
        if: always()
        run: docker compose ps --all

      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color

      - name: Remove CI environment
        if: always()
        run: docker compose down --volumes --remove-orphans
